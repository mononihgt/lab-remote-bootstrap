<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lab Remote Bootstrap - Subscription Manager</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/theme.css') }}">
</head>
<body>
  <div class="app-container">
    <!-- Header -->
    <header>
      <div class="header-content">
        <div class="logo">
          <span class="logo-icon">🚀</span>
          <h1>Lab Remote Bootstrap</h1>
        </div>
        <nav class="header-actions">
          <a href="#" class="btn btn-secondary" data-view="subscriptions">📡 Subscriptions</a>
          <a href="#" class="btn btn-secondary" data-view="health">💚 Health</a>
          <a href="#" class="btn btn-secondary" data-view="dashboard">📊 Dashboard</a>
        </nav>
      </div>
    </header>

    <!-- Alert container -->
    <div id="alert-container" style="position: fixed; top: 80px; right: 20px; z-index: 1001; max-width: 400px;"></div>

    <!-- Main content -->
    <main class="main-content">
      <!-- Subscriptions View -->
      <div id="subscriptions-view" class="view">
        <div class="card">
          <div class="card-header">
            <h2 class="card-title">
              <span>📡</span>
              Clash Subscriptions
            </h2>
            <button class="btn btn-primary" onclick="SubscriptionManager.showAddModal()">
              + Add Subscription
            </button>
          </div>
          <div id="subscriptions-list">
            <p class="text-muted">Loading subscriptions...</p>
          </div>
        </div>
      </div>

      <!-- Health View -->
      <div id="health-view" class="view hidden">
        <div class="card">
          <div class="card-header">
            <h2 class="card-title">
              <span>💚</span>
              System Health
            </h2>
            <button class="btn btn-secondary" onclick="HealthMonitor.check()">
              🔄 Refresh
            </button>
          </div>
          <div id="health-status">
            <p class="text-muted">Loading health status...</p>
          </div>
        </div>
      </div>

      <!-- Dashboard View -->
      <div id="dashboard-view" class="view hidden">
        <div class="card">
          <div class="card-header">
            <h2 class="card-title">
              <span>📊</span>
              Clash Dashboard
            </h2>
          </div>
          <div style="position: relative; padding-bottom: 75%; height: 0; overflow: hidden;">
            <iframe
              id="dashboard-frame"
              src=""
              style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: 1px solid var(--color-border); border-radius: var(--radius-md);"
              frameborder="0"
            ></iframe>
          </div>
        </div>
      </div>
    </main>
  </div>

  <!-- Add Subscription Modal -->
  <div id="add-modal" class="modal-overlay hidden" onclick="if(event.target === this) UI.hideModal('add-modal')">
    <div class="modal" onclick="event.stopPropagation()">
      <div class="modal-header">
        <h3 class="modal-title">Add Subscription</h3>
        <button class="btn btn-secondary btn-sm" onclick="UI.hideModal('add-modal')">✕</button>
      </div>
      <form id="add-form" onsubmit="event.preventDefault(); SubscriptionManager.add()">
        <div class="form-group">
          <label class="form-label" for="sub-name">Name</label>
          <input
            type="text"
            id="sub-name"
            class="form-input"
            placeholder="My Subscription"
            required
          />
        </div>
        <div class="form-group">
          <label class="form-label" for="sub-url">Subscription URL</label>
          <input
            type="url"
            id="sub-url"
            class="form-input"
            placeholder="https://..."
            required
          />
        </div>
        <div class="form-group">
          <label class="form-label" for="sub-template">Template</label>
          <select id="sub-template" class="form-select">
            <option value="minimal">Minimal - Basic proxy selection</option>
            <option value="balanced" selected>Balanced - Auto URL-test + rules</option>
            <option value="full">Full - Advanced with fallback</option>
          </select>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" onclick="UI.hideModal('add-modal')">
            Cancel
          </button>
          <button type="submit" id="add-btn" class="btn btn-primary">
            Add Subscription
          </button>
        </div>
      </form>
    </div>
  </div>

  <!-- Remove Subscription Modal -->
  <div id="remove-modal" class="modal-overlay hidden" onclick="if(event.target === this) UI.hideModal('remove-modal')">
    <div class="modal" onclick="event.stopPropagation()">
      <div class="modal-header">
        <h3 class="modal-title">Remove Subscription</h3>
        <button class="btn btn-secondary btn-sm" onclick="UI.hideModal('remove-modal')">✕</button>
      </div>
      <p>
        Are you sure you want to remove subscription <strong id="remove-name"></strong>?
        This action cannot be undone.
      </p>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" onclick="UI.hideModal('remove-modal')">
          Cancel
        </button>
        <button type="button" id="remove-btn" class="btn btn-danger" onclick="SubscriptionManager.remove()">
          Remove
        </button>
      </div>
    </div>
  </div>

  <script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
