# Lab Remote Bootstrap Configuration
# Copy this file to config.yaml and customize for your setup

# Deployment configuration
deployment:
  mode: host  # 'host' or 'docker'
  target: remote  # 'remote' (deploy via SSH) or 'local' (deploy on current machine)

# Lab server SSH target used only when deployment.target is 'remote'.
# Local deployments use the active local account as the target account.
target:
  host: lab.example.com
  user: labuser
  ssh_port: 22
  # Optional local SSH key. Leave empty to use ~/.ssh/config or ssh-agent.
  ssh_identity_file: ""

# Cloud server configuration (for reverse SSH tunnel)
cloud:
  host: cloud.example.com
  user: ubuntu
  reverse_port: 2223
  # Address to bind on the cloud server for reverse SSH.
  # Use 0.0.0.0 for direct access from the internet, or 127.0.0.1 if you only access it from the cloud server.
  reverse_bind_address: 0.0.0.0

# Clash proxy configuration
clash:
  install_root: /opt/lab-remote-stack
  http_port: 7890
  socks_port: 7891
  api_port: 9090
  api_secret: ""

  # Subscription settings
  subscription:
    # Default template: minimal, balanced, or full
    template: balanced
    auto_update: false
    update_interval: 86400  # seconds (24 hours)

# AutoSSH reverse tunnel configuration
autossh:
  # Server-side key on the lab machine, used by AutoSSH to connect to the cloud server.
  identity_file: ~/.ssh/id_ed25519_autossh

# Zsh terminal configuration
zsh:
  enable_plugins: true
  custom_config:
    # zsh-autosuggestions style
    autosuggestions_style: "fg=240"

    # fzf color theme
    fzf_theme:
      fg: "#CBE0F0"
      bg: "#011628"
      bg_highlight: "#143652"
      purple: "#B388FF"
      blue: "#06BCE4"
      cyan: "#2CF9ED"

    # bat theme
    bat_theme: "tokyonight_night"

    # Enable enhanced aliases
    eza_aliases: true
    tldr_alias: true
    fastfetch_on_startup: true

# Web management interface
web:
  enabled: true
  port: 5000
  # Local PC port used by lab-remote-ctl web open/start for the SSH tunnel in remote deployments.
  local_port: 5001
  bind: 127.0.0.1

# Docker mode specific settings (only used when deployment.mode = docker)
docker:
  container_name: lab-remote-dev
  root_password: changeme
  host_ssh_port: 2222
  target_user: developer
